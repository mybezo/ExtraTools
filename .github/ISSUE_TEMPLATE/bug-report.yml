name: Bug Report
description: Report a bug or problem with this plugin
labels: ["bug"]
assignees:
  - ybw0014
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the issue tracker
        You are reporting a bug in ExtraTools.
        For feedback or suggestions, please use the [QQ group](https://50l.cc/sf-qg).
        We recommend reading [this article](https://slimefun-wiki.guizhanss.cn/How-to-report-bugs) first to learn how to report a bug properly.

        <strong><i>You must fill in all fields marked with an asterisk (*)</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: You are using a version downloaded from the resource site (https://resources.guizhanss.com)
          required: true
        - label: You have verified the checksum of the downloaded file and confirmed it downloaded completely
          required: true
        - label: You have not modified the downloaded file in any way
          required: true
        - label: You have searched the [list of known issues](https://github.com/SlimefunGuguProject/ExtraTools/issues) and found no duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the problem you are reporting in detail.
        Detailed information helps us resolve the issue faster.
      placeholder: Just saying "it doesn't work" does not help developers find the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Describe in detail how to reproduce the problem.
        If you have a video, please provide a link here.
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What did you expect to happen?
        Sometimes the cause is a misunderstanding of how a feature works.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        Check whether the server log contains any errors. If it does, upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the log directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If the server log mentions a file in `/plugins/Slimefun/error-reports` (an error report),
        upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the error report directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in game and paste or screenshot the **full output** here.
        If the command does not work, provide your server software, server Minecraft version, Slimefun version, this plugin's version and your plugin list.
        If the server's Minecraft version differs from the client version you connect with, please mention that too.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
